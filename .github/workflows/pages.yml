name: Build & Deploy (Cloudflare Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write   # 末尾「Post commit status for Decap」需要写 legacy commit status

# 单 job：build + deploy 同跑在一个 runner 上，省掉「上传 artifact → 第二个 runner 冷启动 → 下载 artifact」
# 这段纯搬运（旧版拆成 build/deploy 两个 job），实测每次白花 ~15–25s + 第二次 runner 排队风险。
# 没配 CF 凭证时 deploy 步骤自动跳过，build 仍跑通充当构建校验。
#
# 说明：未设 concurrency。采集器 bot 的「自动回填抖音封面」提交只改缩略图/封面，无需即时上线，
# 靠下方 if 跳过整条流水线（空跑几秒收场）；封面会在用户下一次正常发布时随整站一并部署。
# 不设 concurrency 是为了避免 bot 的 run 把用户在途发布 cancel / supersede 掉，导致发布迟迟不上线。

jobs:
  build-deploy:
    # 采集器 bot 的「自动回填抖音封面」提交只改缩略图/封面，无需即时上线，跳过整条流水线。
    if: ${{ !contains(github.event.head_commit.message, '自动回填') }}
    # 2026-10-29 起 ubuntu-latest 升级为 ubuntu-26.04，已不再提供 Ruby 3.1.7，
    # 导致 ruby/setup-ruby 拉 3.1.x 时 404 失败。钉到 ubuntu-24.04（Ruby 3.1 仍可用，
    # 也是本次失败前构建一直通过的镜像），保持 .ruby-version=3.1 不变。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CF == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'marginalia-blog' }} --commit-dirty=true

      # 补写旧版 commit status：GitHub Actions 只写 check-runs，不写 legacy status，
      # 而 Decap 后台顶栏的「点击以预览」按钮读的是 legacy status —— 空状态恒为 pending，
      # 按钮就永远转圈点不动。这里部署完成后补一条 state=success、target_url=站点首页，
      # 按钮即变为可点的「查看预览」（新标签打开站点）。
      - name: Post commit status for Decap
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE=success; DESC="已上线 marginalia.201573.xyz"
          else
            STATE=failure; DESC="部署失败，详见 Actions"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"deploy\",\"target_url\":\"https://marginalia.201573.xyz/\",\"description\":\"$DESC\"}" \
            > /dev/null && echo "commit status posted: $STATE"
