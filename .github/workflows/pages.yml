name: Build & Deploy (Cloudflare Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cf-pages"
  # false = 新推送排队而非取消在途 run。
  # 关键：采集器 bot 会频繁推「自动回填抖音封面」提交，若这里为 true，
  # 它会把用户正在跑的发布取消重来（concurrency 在工作流级、早于 job 的 if 生效），
  # 导致用户发布反复重来、迟迟不上线（「一直都在成功的路上」）。
  # 配合 build 的 if 跳过 bot 提交，bot run 退化为几秒空跑，既不占构建也不取消用户发布。
  cancel-in-progress: false

jobs:
  build:
    # 采集器 bot 的「自动回填抖音封面」提交只改缩略图/封面，无需即时上线，
    # 跳过整条流水线——既省 CI，也避免它把用户正在跑的部署 cancel 掉（根因：
    # concurrency.cancel-in-progress 会取消在途 run，导致用户发布反复重来、迟迟不上线）。
    # 封面会在用户下一次正常发布时随整站一并部署。
    if: ${{ !contains(github.event.head_commit.message, '自动回填') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Upload _site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 没配 CF 凭证时整个 deploy 阶段跳过；上面的 build 仍会跑通，充当构建校验。
    # （job/step 的 if 不能用 secrets 上下文，故用 env 间接判断。）
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Download built site
        if: ${{ env.HAS_CF == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CF == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'marginalia-blog' }} --commit-dirty=true
