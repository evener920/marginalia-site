name: Build & Deploy (Cloudflare Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# 故意不设置 concurrency：
# 采集器 bot 会频繁推「自动回填抖音封面」提交。若设 concurrency，无论 cancel-in-progress
# 为 true 还是 false 都会坑用户发布——true 会直接取消在途的发布；false 下 bot 的（更新）
# run 会 supersede 抢占用户的 run，导致用户部署被跳过。去掉 concurrency 后用户发布独立
# 跑完、永不被 bot 干扰；bot 提交靠下方 build 的 if 跳过构建，只需几秒空跑收场。

jobs:
  build:
    # 采集器 bot 的「自动回填抖音封面」提交只改缩略图/封面，无需即时上线，
    # 跳过整条流水线——既省 CI，也避免它把用户正在跑的部署 cancel 掉（根因：
    # concurrency.cancel-in-progress 会取消在途 run，导致用户发布反复重来、迟迟不上线）。
    # 封面会在用户下一次正常发布时随整站一并部署。
    if: ${{ !contains(github.event.head_commit.message, '自动回填') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Upload _site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 没配 CF 凭证时整个 deploy 阶段跳过；上面的 build 仍会跑通，充当构建校验。
    # （job/step 的 if 不能用 secrets 上下文，故用 env 间接判断。）
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Download built site
        if: ${{ env.HAS_CF == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CF == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'marginalia-blog' }} --commit-dirty=true
