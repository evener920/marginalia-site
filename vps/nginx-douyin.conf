server {
    listen 80;
    listen [::]:80;
    server_name transcribe.201573.xyz douyin.201573.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name transcribe.201573.xyz douyin.201573.xyz;

    # 复用 Cloudflare 泛域名源站证书 (*.201573.xyz, 有效期至 2041)
    ssl_certificate /etc/nginx/ssl/outline.201573.xyz.crt;
    ssl_certificate_key /etc/nginx/ssl/outline.201573.xyz.key;

    client_max_body_size 200m;

    # 抖音收藏入库 Worker 的反向代理：浏览器只跟境内可达的 201573.xyz 打交道，
    # 由本 VPS 转发到 *.workers.dev（workers.dev 在境内常被墙，VPS 东京出口可正常访问）。
    location = /douyin-ingest {
        # 无尾斜杠直达：避免 nginx 301 到带斜杠版本
        # （部分客户端的 POST 不跟随重定向，会静默失败）
        proxy_pass https://marginalia-douyin-ingest.evener920.workers.dev/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host marginalia-douyin-ingest.evener920.workers.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 20s;
    }

    location /douyin-ingest/ {
        proxy_pass https://marginalia-douyin-ingest.evener920.workers.dev/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host marginalia-douyin-ingest.evener920.workers.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
