<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>内容管理 · Marginalia</title>
  </head>
  <body>
    <!-- Decap CMS 会自动加载同目录下的 config.yml -->
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
    <script>
    /* ============================================================
       把「代码块 / 图片」提升为工具栏独立按钮。
       Decap（含最新版）官方都不支持工具栏自定义，这里用 DOM 注入实现。
       - 在编辑器工具栏挂载时即钉上按钮（无需先点 +）
       - 点击时临时隐藏 + 的下拉菜单再自动选中，避免位移/闪烁
       任何一步失败都静默跳过，不影响后台正常使用。
       ============================================================ */
    (function () {
      if (window.__mgPin) return;
      window.__mgPin = true;

      var CODE_LABELS = ["Code Block", "代码块"];
      var IMG_LABELS  = ["Image", "图片"];
      var SVG_CODE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
      var SVG_IMG  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

      function textOf(el) { return (el.textContent || "").trim(); }
      function isVisible(el) { return !!(el && el.offsetParent); }
      function findMenuItem(labels) {
        var els = document.querySelectorAll('button, [role="menuitem"], li, a');
        for (var i = 0; i < els.length; i++) {
          if (labels.indexOf(textOf(els[i])) !== -1 && isVisible(els[i])) return els[i];
        }
        return null;
      }

      /* 找编辑器工具栏：按钮最集中的那个容器；锚点 = 最后一个按钮（即 + 插入按钮） */
      function findToolbar() {
        var btns = document.querySelectorAll("button");
        var count = {};
        for (var i = 0; i < btns.length; i++) {
          var p = btns[i].parentElement;
          if (p) count[p] = (count[p] || 0) + 1;
        }
        var best = null, bestN = 6;
        for (var k in count) { if (count[k] > bestN) { bestN = count[k]; best = k; } }
        return best;
      }

      var hiding = false; // 仅在程序化展开 + 菜单时隐藏它

      /* 菜单一出现就隐藏（仅当 hiding 为真），消除下拉位移/闪烁 */
      new MutationObserver(function () {
        if (!hiding) return;
        var m = findMenuItem(CODE_LABELS) || findMenuItem(IMG_LABELS);
        if (m) {
          var box = m.closest("ul") || m.parentElement;
          if (box) box.style.visibility = "hidden";
        }
      }).observe(document.body, { childList: true, subtree: true });

      function activate(labels, anchor) {
        var item = findMenuItem(labels);
        if (item) { item.click(); return; }
        if (!anchor) return;
        hiding = true;
        anchor.click();                       // 展开 + 菜单（已被观察器隐藏）
        setTimeout(function () {
          var it = findMenuItem(labels);
          if (it) it.click();                // 自动选中，菜单随即关闭
          hiding = false;
        }, 90);
      }

      function pin() {
        var toolbar = findToolbar();
        if (!toolbar || toolbar.dataset.mgPin === "1") return;
        var anchor = toolbar.querySelector("button:last-child") || toolbar.lastElementChild;
        if (!anchor || anchor.tagName !== "BUTTON") return;

        function makePin(svg, title, labels) {
          var b = anchor.cloneNode(false);    // 复制样式类，不带原事件
          b.type = "button";
          b.title = title;
          b.setAttribute("data-mg-pin", title);
          b.innerHTML = svg;
          b.addEventListener("mousedown", function (e) { e.preventDefault(); });
          b.addEventListener("click", function (e) {
            e.preventDefault(); e.stopPropagation();
            activate(labels, anchor);
          });
          return b;
        }

        var pinCode = makePin(SVG_CODE, "代码块", CODE_LABELS);
        var pinImg  = makePin(SVG_IMG,  "图片",   IMG_LABELS);
        toolbar.insertBefore(pinImg, anchor);
        toolbar.insertBefore(pinCode, pinImg);
        toolbar.dataset.mgPin = "1";
      }

      /* 编辑器工具栏挂载/重渲染时都会触发，自动补钉按钮 */
      new MutationObserver(pin).observe(document.body, { childList: true, subtree: true });
    })();
    </script>
  </body>
</html>
