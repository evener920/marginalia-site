<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>内容管理 · Marginalia</title>
  </head>
  <body>
    <!-- Decap CMS：版本锁定 3.17.1（避免 ^ 漂移导致编辑器行为变化）；CMS_MANUAL_INIT = 先注册自定义组件再手动 init -->
    <script>
    /* 关闭「离开页面」确认弹窗：Decap 编辑器在有未保存改动时注册
       window.addEventListener('beforeunload', exitBlocker)，浏览器因此弹
       「你确定要离开此页面吗」。此处赶在 Decap bundle 加载前打补丁：
       吞掉对 window 的 beforeunload/unload 监听注册，并挡掉直接赋值。 */
    (function () {
      var orig = EventTarget.prototype.addEventListener;
      EventTarget.prototype.addEventListener = function (type, fn, opts) {
        if (this === window && (type === 'beforeunload' || type === 'unload')) return;
        return orig.call(this, type, fn, opts);
      };
      try {
        Object.defineProperty(window, 'onbeforeunload', {
          set: function () {},
          get: function () { return null; },
          configurable: true
        });
      } catch (e) { /* 老浏览器忽略 */ }
      /* 站内切换/返回时的「未保存确认」confirm 弹窗（Decap 路由 blocker
         走 window.confirm）：只对离开类确认自动放行，删除文件、加载
         本地备份等其他确认保持原生弹窗，避免误删。 */
      var origConfirm = window.confirm;
      window.confirm = function (msg) {
        try {
          if (typeof msg === 'string' && /离开|leave/i.test(msg)) return true;
        } catch (e) { /* 忽略 */ }
        return origConfirm.apply(window, arguments);
      };
    })();
    window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
    <script>
    /* ============================================================
       覆盖 Decap 内置「image」编辑器组件（registerEditorComponent
       同 id 即覆盖：editorComponents.set(id, …)）
       旧面板：外层 IMAGE 徽章 + 折叠箭头 + 内层 IMAGE 控件 +
               ALT TEXT / TITLE 两个输入框 —— 笨重难看。
       新设计：
       - 组件标签改「图片」，表单只留一个图片选择器
       - ALT/TITLE 从表单砍掉（正文插图极少用）；
         pattern/fromBlock/toBlock 仍完整带 alt/title，
         老文章里已有的 alt/title 数据不会丢
       - 卡片视觉由下方「卡片重绘」脚本接管
       ============================================================ */
    window.addEventListener('load', function () {
      try {
        if (window.CMS && CMS.registerEditorComponent) {
          CMS.registerEditorComponent({
            id: 'image',                       // 同名覆盖内置 image 组件
            label: '图片',
            icon: 'image',
            fields: [
              { name: 'image', label: '', widget: 'image', media_library: { allow_multiple: false } },
            ],
            pattern: /^!\[([^\]]*)\]\((.*?)(\s+"([^"]*)")?\)/,
            fromBlock: function (m) { return { image: m[2], alt: m[1], title: m[4] }; },
            toBlock: function (o) {
              return '![' + (o.alt || '') + '](' + (o.image || '') + (o.title ? ' "' + o.title + '"' : '') + ')';
            },
            toPreview: function (o) {
              return '<img src="' + (o.image || '') + '" alt="' + (o.alt || '') + '" style="max-width:100%;border-radius:8px">';
            },
          });
        }
      } catch (e) { /* 注册失败则回落内置组件，不影响使用 */ }
      try { if (window.CMS && CMS.init) CMS.init(); } catch (e) { /* 兜底：Decap 自动初始化 */ }
    });
    </script>
    <script>
    /* ============================================================
       工具栏改造 + 自建插图弹框 v5（Decap 3.17.x，Slate 编辑器）
       v5 关键变化（修"插了图但不显示"）：
       0) 插入前先探测图片能否加载（new Image + 8s 超时）：
          贴错网页链接（unsplash.com/photos/…）/死链/防盗链拒绝时
          当场红字拦下并取消插入，不再产出破图；失焦即探测
       1) 点击全局事件委托（v4 继承）：工具栏重挂载不丢监听
       2) Slate 插入 paste 事件通道走状态机（v4 继承）
       3) 新增 beforeinput insertText 通道（Safari/老引擎兜底）
       4) 插入成功 toast 说明"编辑器显示文本属正常，发布后即为图片"
       ============================================================ */
    (function () {
      if (window.__mgImgDlg) return;
      window.__mgImgDlg = true;

      var SVG_IMG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

      function inModal(el) {
        return !!(el && el.closest && el.closest('[role="dialog"], [class*="modal" i], [class*="Modal"]'));
      }
      function textOf(el) { return (el.textContent || '').trim(); }

      /* ---------- 编辑器实例追踪（focusin 捕获，谁最后有焦点记谁） ---------- */
      var lastEditor = null, lastTextarea = null, lastCM = null;
      document.addEventListener('focusin', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (dlg && dlg.contains(t)) return;                       // 弹框里的输入框不算
        var ed = t.closest('[data-slate-editor="true"], [contenteditable="true"]');
        if (ed) { lastEditor = ed; return; }
        if (t.tagName === 'TEXTAREA') { lastTextarea = t; return; }
        var cmEl = t.closest('.CodeMirror');
        if (cmEl && cmEl.CodeMirror) lastCM = cmEl.CodeMirror;
      }, true);

      /* ---------- 从工具栏按钮出发，找它所属字段容器里的编辑器 ---------- */
      function findRoot(btn) {
        var el = btn, i;
        for (i = 0; i < 8 && el && el !== document.body; i++, el = el.parentElement) {
          try {
            var hit = el.querySelector('[data-slate-editor="true"], .CodeMirror, textarea');
            if (hit) return el;
          } catch (e) { /* continue */ }
        }
        return null;
      }
      function qAll(root, sel) {
        try { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
        catch (e) { return []; }
      }
      function pickEditors(root) {
        var seen = {}, out = [], i, list;
        list = qAll(root, '[data-slate-editor="true"]').concat(qAll(root, '[contenteditable="true"]'));
        for (i = 0; i < list.length; i++) {
          if (dlg && dlg.contains(list[i])) continue;             // 排除弹框自身
          if (!seen[list[i]]) { seen[list[i]] = 1; out.push(list[i]); }
        }
        return out;
      }
      function pickTextareas(root) {
        var out = [], list = qAll(root, 'textarea'), i;
        for (i = 0; i < list.length; i++) { if (!(dlg && dlg.contains(list[i]))) out.push(list[i]); }
        return out;
      }

      /* ---------- 自建弹框 ---------- */
      var dlg = null, dlgAlt = null, dlgUrl = null, dlgStatus = null, ctxRoot = null;

      function buildDlg() {
        dlg = document.createElement('div');
        dlg.id = 'mg-img-dlg';
        dlg.style.cssText = 'position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;background:rgba(15,18,25,.45);';
        dlg.innerHTML =
          '<div role="dialog" style="background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:440px;max-width:92vw;padding:22px 24px;font-family:system-ui,-apple-system,sans-serif;">' +
            '<h3 style="margin:0 0 4px;font-size:16px;font-weight:600;color:#1f2430;">插入图片链接</h3>' +
            '<p style="margin:0 0 12px;font-size:12px;color:#7a8194;">填图片直链（外链 images.unsplash.com/…、images.pexels.com/…、R2，或站内 /assets/img/…）</p>' +
            '<label style="display:block;font-size:12px;color:#5b6270;margin:10px 0 4px;">图片说明（alt，可留空）</label>' +
            '<input id="mg-img-alt" type="text" placeholder="例如：白洋淀的芦苇" style="width:100%;box-sizing:border-box;padding:8px 10px;font-size:14px;border:1px solid #d6dae2;border-radius:6px;outline:none;">' +
            '<label style="display:block;font-size:12px;color:#5b6270;margin:12px 0 4px;">图片直链（必填）</label>' +
            '<input id="mg-img-url" type="text" placeholder="https://… 或 /assets/img/…" style="width:100%;box-sizing:border-box;padding:8px 10px;font-size:14px;border:1px solid #d6dae2;border-radius:6px;outline:none;">' +
            '<div id="mg-img-status" style="display:none;margin-top:8px;font-size:12px;line-height:1.5;"></div>' +
            '<div style="margin-top:20px;display:flex;justify-content:flex-end;gap:10px;">' +
              '<button id="mg-img-cancel" type="button" style="padding:7px 16px;font-size:13px;border:1px solid #cfd4dd;background:#fff;color:#444c5c;border-radius:6px;cursor:pointer;">取消</button>' +
              '<button id="mg-img-ok" type="button" style="padding:7px 18px;font-size:13px;border:none;background:#3184d3;color:#fff;border-radius:6px;cursor:pointer;">插入</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(dlg);
        dlgAlt = dlg.querySelector('#mg-img-alt');
        dlgUrl = dlg.querySelector('#mg-img-url');
        dlgStatus = dlg.querySelector('#mg-img-status');

        dlg.addEventListener('mousedown', function (e) { if (e.target === dlg) closeDlg(); });
        dlg.querySelector('#mg-img-cancel').addEventListener('click', closeDlg);
        dlg.querySelector('#mg-img-ok').addEventListener('click', insertMd);
        dlg.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeDlg();
          if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT') { e.preventDefault(); insertMd(); }
        });
        /* 失焦即探测：贴错链接当场红字提示，不用等发布 */
        dlgUrl.addEventListener('blur', function () { var u = (dlgUrl.value || '').trim(); if (u) probeAndShow(u); });
        dlgUrl.addEventListener('paste', function () { setTimeout(function () { probeAndShow((dlgUrl.value || '').trim()); }, 50); });
      }

      /* ---------- 图片链接探测（插入前验证，杜绝"插了不显示"） ---------- */
      var PAGE_HINT = '（这看起来是网页链接，不是图片直链）';
      function looksLikePageUrl(u) {
        return /unsplash\.com\/photos\/|pexels\.com\/photo\/[^/]+\/?$|500px\.com\/photo\/|weibo\.(com|cn)|zhihu\.com/.test(u);
      }
      function setStatus(text, kind) {
        if (!dlgStatus) return;
        dlgStatus.style.display = 'block';
        dlgStatus.textContent = text;
        dlgStatus.style.color = kind === 'err' ? '#c0392b' : (kind === 'ok' ? '#1e8449' : '#7a8194');
        if (dlgUrl) dlgUrl.style.borderColor = kind === 'err' ? '#d9534f' : (kind === 'ok' ? '#1e8449' : '#d6dae2');
      }
      function probeAndShow(url) {
        setStatus('校验图片链接…', 'pending');
        probeUrl(url, function (ok, why) {
          if (ok) { setStatus('✓ 图片可正常加载', 'ok'); return; }
          var msg = '✗ 图片加载失败（' + (why === 'timeout' ? '超时' : '链接无效或拒绝访问') + '）';
          if (looksLikePageUrl(url)) msg += PAGE_HINT;
          msg += '，请换直链或改用「封面图」上传';
          setStatus(msg, 'err');
        });
      }
      function probeUrl(url, cb) {
        var im = new Image(), done = false;
        var t = setTimeout(function () { if (!done) { done = true; cb(false, 'timeout'); } }, 8000);
        im.onload = function () { if (!done) { done = true; clearTimeout(t); cb(im.naturalWidth > 0, im.naturalWidth > 0 ? null : 'empty'); } };
        im.onerror = function () { if (!done) { done = true; clearTimeout(t); cb(false, 'error'); } };
        im.src = url;
      }

      function openDlg(ctxBtn) {
        if (!dlg) buildDlg();
        ctxRoot = ctxBtn ? findRoot(ctxBtn) : null;               // 记住按钮属于哪个字段
        dlgAlt.value = '';
        dlgUrl.value = '';
        dlg.style.display = 'flex';
        setTimeout(function () { dlgUrl.focus(); }, 0);
      }
      function closeDlg() { if (dlg) dlg.style.display = 'none'; }

      /* ---------- toast 提示（插入成功反馈） ---------- */
      var toastEl = null, toastTimer = null;
      function toast(msg) {
        if (!toastEl) {
          toastEl = document.createElement('div');
          toastEl.style.cssText = 'position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:1000000;background:#1f2430;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-family:system-ui,-apple-system,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none;';
          document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.style.opacity = '1';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.style.opacity = '0'; }, 2200);
      }

      /* ---------- Slate 光标恢复 ---------- */
      function caretEnd(ed) {
        var sel = window.getSelection();
        var inside = sel.rangeCount > 0 && ed.contains(sel.anchorNode);
        if (!inside) {
          var r = document.createRange();
          r.selectNodeContents(ed);
          r.collapse(false);
          sel.removeAllRanges();
          sel.addRange(r);
        }
      }
      function hasUrl(ed, url) { return (ed.textContent || '').indexOf(url) !== -1; }

      /* ---------- 写入通道 1：paste 事件（走 Slate 状态机，最可靠） ---------- */
      function slatePaste(ed, md) {
        try {
          ed.focus();
          caretEnd(ed);
          var dt = new DataTransfer();
          dt.setData('text/plain', md);
          var ev = new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true });
          ed.dispatchEvent(ev);
          return true;                                            // 结果由异步校验判定
        } catch (e) { return false; }
      }
      /* ---------- 写入通道 2：execCommand（同步校验） ---------- */
      function slateExec(ed, md, url) {
        try {
          ed.focus();
          caretEnd(ed);
          document.execCommand('insertText', false, md);
          return hasUrl(ed, url);
        } catch (e) { return false; }
      }
      /* ---------- 写入通道 3：beforeinput insertText（Safari/老引擎兜底） ---------- */
      function slateBeforeinput(ed, md) {
        try {
          ed.focus();
          caretEnd(ed);
          var ev = new InputEvent('beforeinput', { inputType: 'insertText', data: md, bubbles: true, cancelable: true });
          ed.dispatchEvent(ev);
          return true;                                            // 结果由外层异步校验判定
        } catch (e) { return false; }
      }
      /* ---------- 写入通道 4：CodeMirror（老版本兜底） ---------- */
      function cmInsert(md) {
        if (lastCM && lastCM.replaceSelection && document.contains(lastCM.getTextArea ? lastCM.getTextArea() : null)) {
          try { lastCM.replaceSelection(md); lastCM.focus(); return true; } catch (e) { return false; }
        }
        return false;
      }
      /* ---------- 写入通道 4：textarea（Markdown 模式） ---------- */
      function taInsert(ta, md) {
        try {
          var s = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
          var eEnd = ta.selectionEnd == null ? s : ta.selectionEnd;
          ta.focus();
          ta.setRangeText(md, s, eEnd, 'end');
          try { ta.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) { /* 老浏览器忽略 */ }
          return true;
        } catch (e) { return false; }
      }

      /* ---------- 插入：定位（ctxRoot→last→文档）× 写入（paste→exec→beforeinput→CM→ta） ---------- */
      function insertMd() {
        var url = (dlgUrl.value || '').trim().replace(/\s+/g, '');
        var alt = (dlgAlt.value || '').trim().replace(/[\[\]]/g, '');
        if (!url) { dlgUrl.style.borderColor = '#d9534f'; dlgUrl.focus(); return; }
        var md = '![' + alt + '](' + url + ')';

        /* 先探测图片能否加载——贴错网页链接/死链时当场拦下，不插入 */
        setStatus('校验图片链接…', 'pending');
        probeUrl(url, function (ok, why) {
          if (!ok) {
            var msg = '✗ 图片加载失败（' + (why === 'timeout' ? '超时' : '链接无效或拒绝访问') + '）';
            if (looksLikePageUrl(url)) msg += PAGE_HINT;
            msg += '。已取消插入，请换直链或改用「封面图」上传。';
            setStatus(msg, 'err');
            return;
          }
          setStatus('✓ 图片可正常加载', 'ok');
          doInsert(md, url);
        });
      }

      function doInsert(md, url) {
        /* 候选编辑器：字段容器内 → 最后聚焦的 → 全文档 */
        var candidates = pickEditors(ctxRoot);
        if (lastEditor && document.contains(lastEditor) && candidates.indexOf(lastEditor) === -1) candidates.push(lastEditor);
        var docEditors = pickEditors(document);
        for (var k = 0; k < docEditors.length; k++) if (candidates.indexOf(docEditors[k]) === -1) candidates.push(docEditors[k]);

        var ci = 0;
        function tryEditor() {
          if (ci >= candidates.length) { tryCM(); return; }
          var ed = candidates[ci++];
          if (slatePaste(ed, md)) {
            setTimeout(function () {                              // 异步校验 paste 结果
              if (hasUrl(ed, url)) { closeDlg(); toast('已插入图片 ✓（编辑器里显示为文本属正常，发布后即为图片）'); return; }
              if (slateExec(ed, md, url)) { closeDlg(); toast('已插入图片 ✓（编辑器里显示为文本属正常，发布后即为图片）'); return; }
              if (slateBeforeinput(ed, md)) {
                setTimeout(function () {
                  if (hasUrl(ed, url)) { closeDlg(); toast('已插入图片 ✓（编辑器里显示为文本属正常，发布后即为图片）'); return; }
                  tryEditor();
                }, 150);
                return;
              }
              tryEditor();
            }, 150);
          } else { tryEditor(); }
        }
        function tryCM() {
          if (cmInsert(md)) { closeDlg(); toast('已插入图片 ✓'); return; }
          var tas = pickTextareas(ctxRoot);
          if (lastTextarea && document.contains(lastTextarea) && tas.indexOf(lastTextarea) === -1) tas.push(lastTextarea);
          tas = tas.concat(pickTextareas(document));
          for (var i = 0; i < tas.length; i++) { if (taInsert(tas[i], md)) { closeDlg(); toast('已插入图片 ✓'); return; } }

          /* 全部失败：附诊断计数，截图即可定位 */
          var nSlate = qAll(document, '[data-slate-editor="true"]').length;
          var nCE = qAll(document, '[contenteditable="true"]').length;
          var nTA = pickTextareas(document).length;
          var nCM = qAll(document, '.CodeMirror').length;
          window.alert('未找到可插入的正文编辑器\n[诊断 slate=' + nSlate + ' contenteditable=' + nCE +
            ' textarea=' + nTA + ' codemirror=' + nCM + ']\n请截图发我，并把光标点进正文后再试一次。');
        }
        tryEditor();
      }

      /* ---------- 工具栏：删 + 下拉，原位放「图片链接」按钮 ---------- */
      function tidyToolbar() {
        var plus = null;
        var btns = document.querySelectorAll('button[title]');
        for (var i = 0; i < btns.length; i++) {
          var b = btns[i];
          if (b.dataset && b.dataset.mgHandled === '1') continue;
          var t = b.getAttribute('title') || '';
          if (/component|组件|компонент/i.test(t)) { plus = b; break; }
        }
        if (!plus) return;
        if (plus.dataset && plus.dataset.mgHandled === '1') return;

        var mine = plus.cloneNode(false);            // 复制 styled-components 类名，继承样式
        mine.removeAttribute('disabled');
        mine.removeAttribute('id');
        mine.setAttribute('title', '图片链接（弹框填直链）');
        mine.setAttribute('data-mg-img', '1');       // 点击由全局委托接管，不绑实例
        mine.innerHTML = SVG_IMG;
        plus.parentNode.insertBefore(mine, plus);
        plus.style.display = 'none';                 // 删掉 + 下拉按钮
        plus.dataset.mgHandled = '1';

        /* 外层若只是 + 按钮的空壳包装，一并隐藏 */
        var wrap = plus.parentElement;
        if (wrap && wrap !== document.body && !textOf(wrap) && wrap.querySelectorAll('button').length <= 1) {
          wrap.style.visibility = 'hidden';
        }
      }

      /* ---------- 全局事件委托：按钮随重挂载生死，监听永不丢 ---------- */
      document.addEventListener('mousedown', function (e) {
        try {
          if (e.target.closest && e.target.closest('[data-mg-img="1"]')) e.preventDefault();  // 防止抢走编辑器焦点
        } catch (err) { /* 静默 */ }
      }, true);
      document.addEventListener('click', function (e) {
        try {
          var btn = e.target && e.target.closest ? e.target.closest('[data-mg-img="1"]') : null;
          if (!btn || inModal(btn)) return;
          e.preventDefault();
          e.stopPropagation();
          openDlg(btn);
          return;
        } catch (err) { /* 静默 */ }
        /* 菜单兜底：若按钮未挂上，仍可从 + 菜单点「图片链接」 */
        try {
          var t = e.target && e.target.closest ? e.target.closest('button, [role="menuitem"], li, a') : null;
          if (!t || inModal(t)) return;
          if (textOf(t) !== '图片链接' && textOf(t) !== '图片') return;
          e.preventDefault();
          e.stopPropagation();
          openDlg(t);
        } catch (err2) { /* 静默 */ }
      }, true);

       客户端分页（每页 20，与后端分块对齐）：
       - 锚点：条目链接 a[href*="/entries/"]，卡片取最近 <li>；
         列表容器末尾的非卡片空元素 = 加载哨兵（耗尽后 React 移除）
       - 翻页：点「下一页」若条目未加载够，在 body 上临时垫高保证
         可滚，滚动哨兵触发 Decap 原生续载，载够后切片并回顶

         v2 复刻台实测把翻页条插进列表容器会让 React 对账崩溃

        function renderPager(more, pages, total) {

        function cleanup(cards) {

            if (!more && cur.page > pages - 1) cur.page = pages - 1;

            if (hidden === expectHidden && bar && document.contains(bar)

            for (var k = 0; k < total; k++) {
              var want = (k >= from && k < from + PAGE_SIZE) ? '' : 'none';
              if (cards[k].style.display !== want) cards[k].style.display = want;

      } catch (e) { /* 静默 */ }
    });

        if (s < 3600) return Math.round(s / 60) + '分钟前';

      var timer = null;

      function poll() {

       v1 教训：把 <img> 转成 Markdown 占位"纯文本"不行——Decap 保存时会把纯文本里的

  (function () {
    try {
      var toast = null, toastTimer = null;
      function showToast(msg) {
        try {
          if (!toast) {
            toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
              'z-index:2147483647;background:#1f2937;color:#fff;padding:8px 14px;border-radius:8px;' +
              'font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;' +
              'box-shadow:0 4px 12px rgba(0,0,0,.25);transition:opacity .3s;pointer-events:none';
            (document.body || document.documentElement).appendChild(toast);
          }
          toast.textContent = msg;
          toast.style.opacity = '1';
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toast.style.opacity = '0'; }, 2600);
        } catch (e) { /* 静默 */ }

        if (!imgs.length) return null;

          try {
            var src = (img.getAttribute('src') || '').trim();
            var ok = /^https?:\/\//i.test(src) || /^\//.test(src);
            if (ok) {
              /* v2：转成 <a> 链接节点（正确反序列化/序列化），不再用纯文本占位 */
              var a = doc.createElement('a');

          while ((m = re.exec(txt))) map[m[1]] = m[2].replace(/^["']|["']$/g, '');

      /* ---------- 列表卡片定位（与分页脚本同一锚点） ---------- */
      function getColl() {

        return m ? decodeURIComponent(m[1]) : null;
      }
      function collectCards() {
        var cards = [], seen = [];
        if (!getColl()) return cards;
        var links = document.querySelectorAll('a[href*="/entries/"]');
        for (var i = 0; i < links.length; i++) {
          var card = links[i].closest ? links[i].closest('li') : null;
          if (!card) card = links[i].parentElement;
          if (card && seen.indexOf(card) < 0) { seen.push(card); cards.push(card); }
        }
        return cards;
      }
      function entryInfo(card) {
        var a = card.querySelector ? card.querySelector('a[href*="/entries/"]') : null;
        if (!a) return null;
        var m = (a.getAttribute('href') || '').match(/#\/collections\/([^\/]+)\/entries\/(.+)$/);
        if (!m) return null;
        var slug;
        try { slug = decodeURIComponent(m[2]); } catch (e) { slug = m[2]; }

      /* ---------- 复选框注入（幂等：卡片复用已有节点） ---------- */
      function ensureCheckbox(card) {
        var info = entryInfo(card);
        if (!info) return null;
        var cb = card.querySelector(':scope > .mg-cb') || card.querySelector('.mg-cb');
        if (!cb) {
          cb = document.createElement('input');

          });
          card.appendChild(cb);

              var cb = cards[i].querySelector('.mg-cb');

      function updateCount() {
        var n = Object.keys(selected).length;

        delBtn.textContent = '删除选中' + (n ? ' (' + n + ')' : '');

      /* ---------- 删除 v4：Git Data API 单次提交（快） + 并行逐文件回退 ---------- */
      var GAPI = 'https://api.github.com/repos/' + REPO + '/git/';
      /* 把选中的 slug 解析为仓库内实际路径：先按 slug+'.md' 精确匹配，
         再按"去扩展名相等"兜底（slug 与文件名可能不完全一致） */
      function resolvePaths(allPaths, items) {
        var out = [], missing = [];
        items.forEach(function (it) {
          var folder = folders[it.coll] || FALLBACK[it.coll];
          if (!folder) { missing.push(it.coll + '/' + it.slug); return; }
          var exact = folder + '/' + it.slug + '.md';
          if (allPaths.indexOf(exact) > -1) { out.push(exact); return; }
          var hit = null;
          for (var i = 0; i < allPaths.length; i++) {
            var p = allPaths[i];
            if (p.indexOf(folder + '/') === 0 && p.slice(folder.length + 1).replace(/\.[^.]+$/, '') === it.slug) { hit = p; break; }

      function deleteViaGitData(paths) {
        function req(url, body, method) {
          return gh(url, { method: method || 'GET', headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined }).then(function (r) {

          if (!tasks.length) return Promise.resolve();
          var t = tasks.shift();

            var name = shaMap[t.slug + '.md'] ? t.slug + '.md' : null;
            if (!name) {

                if (keys[i].replace(/\.[^.]+$/, '') === t.slug) { name = keys[i]; break; }
              }

            if (!name) throw new Error('未在 ' + t.folder + ' 找到 ' + t.slug);
            var path = t.folder + '/' + name;

              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: '批量删除 ' + path, sha: shaMap[name], branch: BRANCH })
            }).then(function (r) {
              if (!r.ok) return r.json().then(function (j) { throw new Error(path + '：' + ((j && j.message) || r.status)); });
            });
          }).then(function () { done++; })
            .catch(function (err) { fail++; console.warn('Del fail', t.slug, err && err.message); })
            .then(function () {
              countEl.textContent = '删除中… ' + (done + fail) + '/' + total + (fail ? '（失败 ' + fail + '）' : '');

        }

        for (var i = 0; i < Math.min(4, tasks.length); i++) ps.push(worker());

      }
      function deleteSelected() {
        var items = Object.keys(selected).map(function (k) { return selected[k]; });
        if (!items.length || deleting) return;
        if (!window.confirm('确定删除选中的 ' + items.length + ' 个条目？\n删除后 GitHub Actions 会自动重新部署。此操作不可撤销！')) return;
        if (!folders) { toast('集合配置尚未加载完成，请稍后重试'); return; }
        deleting = true; updateCount();
        countEl.textContent = '准备删除…';
        /* 1) 一次拿全仓库文件树（recursive），把所有选中 slug 解析为真实路径 */
        gh(GAPI + 'trees/' + BRANCH + '?recursive=1').then(function (r) {
          if (!r.ok) throw new Error('列文件树失败 ' + r.status);

        }).then(function (tree) {
          var all = (tree.tree || []).filter(function (x) { return x.type === 'blob'; }).map(function (x) { return x.path; });
          var resolved = resolvePaths(all, items);
          if (resolved.missing.length) console.warn('未匹配到文件：', resolved.missing.join(', '));
          if (!resolved.paths.length) throw new Error('没有匹配到任何文件，请刷新页面后重试');
          countEl.textContent = '删除中… 0/' + resolved.paths.length;
          /* 2) 单次提交删除（快路径） */
          return deleteViaGitData(resolved.paths).then(function () {
            return { ok: resolved.paths.length, fail: 0 };
          }).catch(function (err) {
            /* 3) 失败回退：并行逐文件 DELETE */
            console.warn('单提交删除失败，回退为逐个删除：', err && err.message);
            var byColl = {};
            items.forEach(function (it) { (byColl[it.coll] = byColl[it.coll] || []).push(it); });
            return deleteFallback(byColl, resolved.paths.length);
          });
        }).then(function (res) {
          deleting = false;
          selected = {};
          updateCount();
          if (res.fail) { toast('有 ' + res.fail + ' 项删除失败，详情见控制台'); applyAll(); }
          else {
            toast('已删除 ' + res.ok + ' 个条目（单次提交），正在重新部署…');

      /* ---------- 交互 ---------- */
      btn.addEventListener('click', function () {

        selected = {};

      });

      function styleBtn() {

           按钮也一定是左下角小药丸（用户反馈过按钮落到浏览器默认样式） */
        btn.style.cssText = 'position:fixed;left:14px;bottom:16px;z-index:2147483646;background:#d23b3b;color:#fff;border:none;border-radius:999px;box-shadow:0 2px 10px rgba(210,59,59,.35);padding:9px 18px;font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;cursor:pointer;user-select:none;letter-spacing:.5px;display:none';

  <script>
  (function () {

        videos:  { folder: '_videos',  label: '视频', layout: 'video' },
        docs:    { folder: '_docs',    label: '文档', layout: 'doc' },
        shujian: { folder: '_shujian', label: '书笺', layout: 'shujian' },

        if (!m) return null;

        try { slug = decodeURIComponent(m[2]); } catch (e) { slug = m[2]; }
        if (!INFO[coll]) return null;

      }
      function refreshBtn() {

      /* ---------- 面板 ---------- */
      function openPanel() {

        if (!cur) { toast('请先进入某个条目的编辑页'); return; }

        msgEl.textContent = '';

        msgEl.textContent = '处理中…';
        Array.prototype.forEach.call(listEl.querySelectorAll('button'), function (b) { b.disabled = true; });
        /* 1) 全仓库文件树：定位源文件（拿 blob sha），并检查目标是否同名冲突 */
        gh(GAPI + 'trees/' + BRANCH + '?recursive=1').then(function (r) {

        }).then(function (tree) {

          var oldPath = null, oldSha = null;

              function req(url, body, method) {

                  if (!r3.ok) return r3.json().catch(function () { return {}; }).then(function (j) {
                    throw new Error((j && j.message) || r3.status);
                  });
                  return r3.json();
                });
              }
              return req(GAPI + 'ref/heads/' + BRANCH).then(function (ref) {
                var head = ref.object.sha;
                return req(GAPI + 'commits/' + head).then(function (c) {
                  var entries = [{ path: newPath, mode: '100644', type: 'blob', content: txt },
                                 { path: oldPath, mode: '100644', type: 'blob', sha: null }];
                  return req(GAPI + 'trees', { base_tree: c.tree.sha, tree: entries }, 'POST').then(function (t) {
                    return req(GAPI + 'commits', { message: '移动 ' + oldPath + ' → ' + newPath + '（' + src.label + ' → ' + dst.label + '）', tree: t.sha, parents: [head] }, 'POST').then(function (nc) {
                      return req(GAPI + 'refs/heads/' + BRANCH, { sha: nc.sha, force: false }, 'PATCH');
                    });
                  });
                });
              });
            };
            if (clash) {
              if (!window.confirm('目标集合「' + dst.label + '」已有同名文件 ' + clash + '，继续将覆盖它！确定？')) {
                throw new Error('已取消（目标同名冲突）');
              }
            }
            return proceed().then(function () {
              closePanel();
              toast('已移动到「' + dst.label + '」，正在跳转…');
              setTimeout(function () {
                location.hash = '#/collections/' + targetName + '/entries/' + cur.slug;
                location.reload();
              }, 900);
            });
          });
        }).catch(function (err) {
          msgEl.textContent = '移动失败：' + (err && err.message);
          Array.prototype.forEach.call(listEl.querySelectorAll('button'), function (b) { b.disabled = false; });
        });
      }

      btn.addEventListener('click', openPanel);
      mask.addEventListener('click', closePanel);
      document.getElementById('mg-mv-close').addEventListener('click', closePanel);

      function mountBtn() { if (document.body && btn && !document.body.contains(btn)) document.body.appendChild(btn); }
      refreshBtn();
      window.addEventListener('hashchange', refreshBtn);
      window.addEventListener('load', refreshBtn);
      setInterval(refreshBtn, 3000);
      mountBtn();
      setInterval(mountBtn, 10000);
    } catch (e) { /* 静默 */ }
  })();
  </script>

  </body>
</html>
