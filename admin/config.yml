# Decap CMS 配置（Cloudflare Pages + GitHub 后端，零服务器）
# 访问地址：https://marginalia-blog.pages.dev/admin/
# 登录：点 “Login with GitHub”，首次会跳 GitHub 授权（走 Decap 官方 OAuth 代理）。
# 想完全自托管鉴权，可把 github 后端换成自建 OAuth 代理（见 README / 改造指南）。

backend:
  name: github
  repo: evener920/marginalia-site
  branch: main
  # 自建 OAuth 代理（Cloudflare Worker）：Decap 会把 base_url 与 auth_endpoint 拼接
  # （auth_endpoint 是路径不是完整 URL，默认 "auth"）。Worker 端 /auth 发起授权、/callback 换 token。
  base_url: https://marginalia-oauth.evener920.workers.dev
  auth_scope: repo

# simple = 保存即直接 commit 到 main；editorial_workflow = 走 PR 审核流（更稳，按需开启）
publish_mode: simple

# 媒体文件上传目录（图片/封面）。Decap 上传后会写进这个目录并提交。
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

# 注意：Decap 3.x 注册的语言包键是 zh_Hans / zh_Hant，没有 "zh"。
# 写 "zh" 会静默回退英文（之前整个后台英文就是这个原因）。
locale: "zh_Hans"

collections:
  # ============ 文章：只填 标题/标签/正文，其余自动 ============
  - name: "posts"
    label: "文章"
    label_singular: "一篇文章"
    folder: "_posts"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    # 列表页每行显示「日期 + 标题」（date 是 front matter 里的字段）
    summary: "{{date | date('YYYY-MM-DD HH:mm')}}  ·  {{title}}"
    editor:
      preview: false
    fields:
      - { name: layout, label: "布局", widget: hidden, default: post }
      - { name: title, label: "标题", widget: string }
      - { name: date, label: "日期", widget: datetime, default: "{{now}}", format: "YYYY-MM-DD HH:mm:ss Z" }
      - { name: author, label: "作者", widget: hidden, default: "" }
      - { name: tags, label: "标签（可留空）", widget: list, required: false, default: [], hint: "点添加后直接输入文字，每行一个标签" }
      - { name: cover, label: "封面图（可选，显示在文章顶部）", widget: image, required: false, hint: "点上传图片选择本地图，发布后显示在文章开头作为头图" }
      - { name: body, label: "正文", widget: markdown }

  # ============ 视频：标题 + 三选一视频来源 + 正文 ============
  - name: "videos"
    label: "视频"
    label_singular: "一个视频"
    folder: "_videos"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    summary: "{{date | date('YYYY-MM-DD HH:mm')}}  ·  {{title}}"
    editor:
      preview: false
    fields:
      - { name: layout, label: "布局", widget: hidden, default: video }
      - { name: title, label: "标题", widget: string }
      - { name: date, label: "日期", widget: datetime, default: "{{now}}", format: "YYYY-MM-DD HH:mm:ss Z" }
      - { name: description, label: "一句话简介（可留空）", widget: string, required: false }
      - name: video_source
        label: "视频来源"
        widget: select
        required: false
        hint: "先选来源，下方只显示对应输入框（选错就删干净只留一个）"
        options:
          - { label: "B 站", value: "bili" }
          - { label: "抖音", value: "douyin" }
          - { label: "YouTube", value: "youtube" }
          - { label: "R2 mp4 文件", value: "file" }
      - { name: bvid, label: "B站 BV 号", widget: string, required: false, hint: "填 BV 号嵌 B 站播放器，如 BV1xx411c7mD" }
      - { name: douyin_id, label: "抖音视频", widget: string, required: false, hint: "直接粘贴抖音分享短链（v.douyin.com/...）会自动解析成数字 ID；也可填链接里 video/ 后的那串数字。内嵌播放稳定性看运气（常需登录 / 跳 App），失败会自动变成「在抖音打开」外链" }
      - { name: douyin_type, label: "抖音作品类型", widget: select, required: false, options: [{label: "视频", value: "video"}, {label: "图文（note）", value: "note"}], hint: "图文作品选「图文」：抖音开放播放器不支持内嵌图文，页面会只给「在抖音打开」外链" }
      - { name: youtube_id, label: "YouTube 链接", widget: string, required: false, hint: "粘贴完整链接（youtube.com/watch?v=… / youtu.be/…）或 11 位视频 ID，自动内嵌官方播放器（全球可播、最稳）" }
      - { name: video_url, label: "R2 视频 mp4 直链", widget: string, required: false, hint: "最稳方式，填 R2 里 mp4 的公开链接" }
      - { name: tags, label: "标签（可留空）", widget: list, required: false, default: [], hint: "填 douyin → 归入「抖音收藏」分类；填 weekly → 归入「AI 周报」" }
      - { name: body, label: "正文（可留空）", widget: markdown, required: false }

  # ============ 文档：标题 + PDF 直链 ============
  - name: "docs"
    label: "文档"
    label_singular: "一个文档"
    folder: "_docs"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    summary: "{{date | date('YYYY-MM-DD HH:mm')}}  ·  {{title}}"
    editor:
      preview: false
    fields:
      - { name: layout, label: "布局", widget: hidden, default: doc }
      - { name: title, label: "标题", widget: string }
      - { name: date, label: "日期", widget: datetime, default: "{{now}}", format: "YYYY-MM-DD HH:mm:ss Z" }
      - { name: pdf_url, label: "R2 PDF 直链", widget: string, hint: "填 R2 里 PDF 的公开链接，页面内嵌翻阅，文件不进 git" }
      - { name: tags, label: "标签（可留空）", widget: list, required: false, default: [], hint: "分类标签，每行一个" }
      - { name: body, label: "正文（可留空）", widget: markdown, required: false }

  # ============ 书笺：标题 + 书影 + 笺注正文 ============
  - name: "shujian"
    label: "书笺"
    label_singular: "一条书笺"
    folder: "_shujian"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    summary: "{{date | date('YYYY-MM-DD HH:mm')}}  ·  {{title}}"
    editor:
      preview: false
    fields:
      - { name: layout, label: "布局", widget: hidden, default: shujian }
      - { name: title, label: "书名 / 篇名", widget: string }
      - { name: date, label: "日期", widget: datetime, default: "{{now}}", format: "YYYY-MM-DD HH:mm:ss Z" }
      - { name: author, label: "原作者（可留空）", widget: string, required: false }
      - { name: description, label: "一句话笺注（可留空）", widget: string, required: false }
      - { name: tags, label: "标签（可留空）", widget: list, required: false, default: [], hint: "分类标签，每行一个" }
      - { name: audio_url, label: "音频直链（mp3/ogg）", widget: string, required: false, hint: "填音频的公开直链（如 R2 桶里的 mp3/ogg），页面出现播放器，文件不进 git" }
      - { name: cover, label: "书影 / 封面图", widget: image, required: false }
      - { name: body, label: "正文（笺注内容）", widget: markdown }

  # ============ 读书：标题 + 封面 + 笔记正文 ============
  - name: "dushu"
    label: "读书"
    label_singular: "一篇读书笔记"
    folder: "_dushu"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    summary: "{{date | date('YYYY-MM-DD HH:mm')}}  ·  {{title}}"
    editor:
      preview: false
    fields:
      - { name: layout, label: "布局", widget: hidden, default: dushu }
      - { name: title, label: "书名 / 篇名", widget: string }
      - { name: date, label: "日期", widget: datetime, default: "{{now}}", format: "YYYY-MM-DD HH:mm:ss Z" }
      - { name: author, label: "原作者（可留空）", widget: string, required: false }
      - { name: description, label: "一句话简介（可留空）", widget: string, required: false }
      - { name: tags, label: "标签（可留空）", widget: list, required: false, default: [], hint: "分类标签，每行一个" }
      - { name: cover, label: "封面图", widget: image, required: false }
      - { name: body, label: "正文（读书笔记）", widget: markdown }

  # ============ 诗词：标题 + 视频入口 + 音频入口（全套） ============
  - name: "poetry"
    label: "诗词"
    label_singular: "一首诗词"
    folder: "_poetry"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    summary: "{{date | date('YYYY-MM-DD HH:mm')}}  ·  {{title}}"
    editor:
      preview: false
    fields:
      - { name: layout, label: "布局", widget: hidden, default: poetry }
      - { name: title, label: "标题", widget: string }
      - { name: date, label: "日期", widget: datetime, default: "{{now}}", format: "YYYY-MM-DD HH:mm:ss Z" }
      - { name: author, label: "作者（可留空）", widget: string, required: false }
      - { name: description, label: "一句话简介（可留空）", widget: string, required: false }
      - { name: tags, label: "标签（可留空）", widget: list, required: false, default: [], hint: "分类标签，每行一个" }
      - name: video_source
        label: "视频来源"
        widget: select
        required: false
        hint: "先选来源，下方只显示对应输入框"
        options:
          - { label: "B 站", value: "bili" }
          - { label: "抖音", value: "douyin" }
          - { label: "YouTube", value: "youtube" }
          - { label: "R2 mp4 文件", value: "file" }
      - { name: bvid, label: "B站 BV 号", widget: string, required: false, hint: "填 BV 号嵌 B 站播放器，如 BV1xx411c7mD" }
      - { name: video_url, label: "R2 视频 mp4 直链", widget: string, required: false, hint: "填 R2 里 mp4 的公开链接" }
      - { name: douyin_id, label: "抖音视频", widget: string, required: false, hint: "粘贴抖音分享短链（v.douyin.com/...）或 video/ 后的数字 ID" }
      - { name: douyin_type, label: "抖音作品类型", widget: select, required: false, options: [{label: "视频", value: "video"}, {label: "图文（note）", value: "note"}] }
      - { name: youtube_id, label: "YouTube 链接", widget: string, required: false, hint: "粘贴完整链接（youtube.com/watch?v=… / youtu.be/…）或 11 位视频 ID，自动内嵌官方播放器" }
      - { name: audio_url, label: "音频直链（mp3/ogg）", widget: string, required: false, hint: "填音频的公开直链（如 R2 桶里的 mp3/ogg），页面出现播放器" }
      - { name: cover, label: "封面图 / 书影（可选）", widget: image, required: false }
      - { name: body, label: "正文（笺注 / 赏析，可留空）", widget: markdown, required: false }

  # ============ 歌本：标题 + 视频入口 + 音频入口（全套） ============
  - name: "songs"
    label: "歌本"
    label_singular: "一首歌"
    folder: "_songs"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    summary: "{{date | date('YYYY-MM-DD HH:mm')}}  ·  {{title}}"
    editor:
